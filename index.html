<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para mi amor ❤️</title>

<style>
body{
  margin:0;
  padding:0;
  background:#0a1a33;
  font-family:Arial;
  text-align:center;
  color:white;
  overflow-x:hidden;
}

h1{font-size:40px;margin-top:40px;}
h2{opacity:0.9;}

#foto{
  width:300px;
  border-radius:20px;
  margin-top:20px;
  box-shadow:0 0 20px rgba(255,255,255,0.3);
}

.beso{
  position:fixed;
  font-size:55px;
  animation:caer 7s linear infinite;
}

@keyframes caer{
  0%{transform:translateY(-10vh);}
  100%{transform:translateY(110vh);}
}

button{
  margin-top:15px;
  padding:12px 25px;
  font-size:18px;
  background:#ff3d7a;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

#ventana,#besito,#castigo{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#142a52;
  padding:25px;
  border-radius:15px;
  box-shadow:0 0 30px rgba(0,0,0,0.6);
}

#ventana img,#besito img,#castigo img{
  width:280px;
  border-radius:15px;
}

#btnNo{position:relative;}
</style>
</head>

<body>

<audio id="musica">
  <source src="es-por-ti.mp3" type="audio/mpeg">
</audio>

<h1>Felices 8 meses mi amor ❤️</h1>
<h2>De tu enamorado Matthew 💖</h2>

<img id="foto"
src="https://github.com/Matthew1S-O/mi-pagina-de-amor/blob/main/IMG_2798.jpeg?raw=true">

<br><br>
<button onclick="mostrarMensaje()">Presióname mi amor ❤️</button>

<p id="mensaje" style="font-size:22px;font-weight:bold;"></p>
<div id="extraBoton"></div>

<div id="ventana">
  <img src="https://github.com/Matthew1S-O/mi-pagina-de-amor/blob/main/IMG_2769.jpeg?raw=true">
  <p style="font-size:20px;font-weight:bold;">¿Amas a tu gordito? 💕</p>
  <button onclick="mostrarBesito()">Sí ❤️</button>
  <button id="btnNo" onmouseover="escapar()">No 😒</button>
</div>

<div id="castigo">
  <img src="https://github.com/Matthew1S-O/mi-pagina-de-amor/blob/main/FullSizeRender.jpeg?raw=true">
  <p style="font-size:20px;font-weight:bold;">Última oportunidad 😏💖</p>
  <button onclick="mostrarBesito()">Sí ❤️</button>
  <button id="btnNo2" onmouseover="escapar()">No 😒</button>
</div>

<div id="besito">
  <h3>Gracias por estos 8 meses ❤️</h3>
  <p>Quiero muchos más contigo 💙✨</p>
  <img src="https://github.com/Matthew1S-O/mi-pagina-de-amor/blob/main/IMG_0743.jpeg?raw=true">
  <h2 style="margin-top:15px;">¿Lista para mañana? 😏💖</h2>
  <p style="font-size:18px;">28/02/2026</p>
</div>

<script>
let intentosNo = 0;

function lluviaBesos(){
  for(let i=0;i<6;i++){
    let b=document.createElement("div");
    b.className="beso";
    b.innerHTML="💋";
    b.style.left=Math.random()*100+"vw";
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),7000);
  }
}
setInterval(lluviaBesos,900);

function mostrarMensaje(){
  document.getElementById("mensaje").innerHTML="Te amo mi gordita ❤️";
  document.getElementById("extraBoton").innerHTML=
  `<button onclick="document.getElementById('ventana').style.display='block'">
    Tengo otra sorpresa 💘
   </button>`;
}

function escapar(){
  intentosNo++;
  let btn = event.target;
  btn.style.left=(Math.random()*200-100)+"px";
  btn.style.top=(Math.random()*200-100)+"px";

  if(intentosNo >= 5){
    document.getElementById("ventana").style.display="none";
    document.getElementById("castigo").style.display="block";
  }
}

function mostrarBesito(){
  document.getElementById("ventana").style.display="none";
  document.getElementById("castigo").style.display="none";
  document.getElementById("besito").style.display="block";
  document.getElementById("musica").play();
}
</script>

</body>
</html>

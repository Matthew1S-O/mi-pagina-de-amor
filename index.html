<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para mi amor ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffe6ec;
      font-family: Arial;
      text-align: center;
      overflow-x: hidden;
    }
    h1 { font-size: 40px; color: #d6004c; margin-top: 40px; }
    h2 { color: #c20042; }

    #foto {
      width: 300px;
      border-radius: 20px;
      margin-top: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    .corazon {
      position: fixed;
      font-size: 25px;
      animation: flotar 4s linear infinite;
      color: #ff2b6e;
    }

    @keyframes flotar {
      0% {transform: translateY(0) scale(1);}
      100% {transform: translateY(-120vh) scale(1.8); opacity: 0;}
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      background: #ff3d7a;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #ventana, #besito {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
    }

    #besito img {
      width: 300px;
      border-radius: 15px;
      margin-top: 10px;
    }

    #btnNo { position: relative; }
  </style>
</head>

<body>

<!-- Música romántica -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/4aQDOUbErNg?autoplay=1&loop=1&playlist=4aQDOUbErNg"
frameborder="0" allow="autoplay"></iframe>

<h1>Felices 7 meses mi amor ❤️</h1>
<h2>De tu enamorado Matthew 💖</h2>

<img id="foto" src="https://github.com/Matthew1S-O/mi-pagina-de-amor/blob/main/IMG_3504.jpeg?raw=true">

<br><br>
<button onclick="mostrarMensaje()">Presióname mi amor ❤️</button>

<p id="mensaje" style="font-size:22px; color:#d6004c; font-weight:bold;"></p>
<div id="extraBoton"></div>

<div id="ventana">
  <p style="font-size:20px; font-weight:bold; color:#d6004c;">
    ¿Amas a tu gordito? 💕
  </p>
  <button onclick="mostrarBesito()">Sí ❤️</button>
  <button id="btnNo" onmouseover="escapar()">No 😒</button>
</div>

<div id="besito">
  <h3>Te amo con todo mi corazón ❤️</h3>
  <img src="https://github.com/Matthew1S-O/mi-pagina-de-amor/blob/main/IMG_0743.jpeg?raw=true">
</div>

<script>
function lanzarCorazones() {
  for (let i = 0; i < 8; i++) {
    let c = document.createElement("div");
    c.className = "corazon";
    c.innerHTML = "❤️";
    c.style.left = Math.random() * 100 + "vw";
    c.style.top = "100vh";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}
setInterval(lanzarCorazones, 800);

function mostrarMensaje() {
  document.getElementById("mensaje").innerHTML = "Te amo mi gordita ❤️";
  document.getElementById("extraBoton").innerHTML =
    `<button onclick="document.getElementById('ventana').style.display='block'">
      Tengo otra sorpresa 💘
     </button>`;
}

function escapar() {
  btnNo.style.left = (Math.random() * 200 - 100) + "px";
  btnNo.style.top = (Math.random() * 200 - 100) + "px";
}

function mostrarBesito() {
  document.getElementById("ventana").style.display = "none";
  document.getElementById("besito").style.display = "block";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para mi amor ❤️</title>

<style>
body{
  margin:0;
  padding:0;
  background:#5a0f2e; /* concho de vino */
  font-family:Arial;
  text-align:center;
  color:white;
  overflow-x:hidden;
}

h1{font-size:40px;margin-top:40px;}
h2{opacity:0.9;}

#foto{
  width:300px;
  border-radius:20px;
  margin-top:20px;
  box-shadow:0 0 20px rgba(255,255,255,0.3);
}

.beso{
  position:fixed;
  font-size:30px;
  animation:caer 4s linear infinite;
}

@keyframes caer{
  0%{transform:translateY(-10vh);opacity:1;}
  100%{transform:translateY(110vh);opacity:0;}
}

button{
  margin-top:20px;
  padding:12px 25px;
  font-size:18px;
  background:#ff3d7a;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

#ventana,#besito{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#7a1c45;
  padding:25px;
  border-radius:15px;
  box-shadow:0 0 30px rgba(0,0,0,0.5);
}

#besito img{
  width:300px;
  border-radius:15px;
}

#btnNo{position:relative;}
</style>
</head>

<body>

<!-- Música -->
<iframe id="musica" width="0" height="0"
src="https://www.youtube.com/embed/4aQDOUbErNg?loop=1&playlist=4aQDOUbErNg"
allow="autoplay"></iframe>

<h1>Felices 7 meses mi amor ❤️</h1>
<h2>De tu enamorado Matthew 💖</h2>

<img id="foto"
src="https://github.com/Matthew1S-O/mi-pagina-de-amor/blob/main/IMG_3504.jpeg?raw=true">

<br><br>
<button onclick="mostrarMensaje()">Presióname mi amor ❤️</button>

<p id="mensaje" style="font-size:22px;font-weight:bold;"></p>
<div id="extraBoton"></div>

<div id="ventana">
  <p style="font-size:20px;font-weight:bold;">¿Amas a tu gordito? 💕</p>
  <button onclick="mostrarBesito()">Sí ❤️</button>
  <button id="btnNo" onmouseover="escapar()">No 😒</button>
</div>

<div id="besito">
  <h3>Te amo infinitamente ❤️</h3>
  <img src="https://github.com/Matthew1S-O/mi-pagina-de-amor/blob/main/IMG_0743.jpeg?raw=true">
</div>

<script>
function lluviaBesos(){
  for(let i=0;i<8;i++){
    let b=document.createElement("div");
    b.className="beso";
    b.innerHTML="💋";
    b.style.left=Math.random()*100+"vw";
    b.style.animationDuration=(3+Math.random()*2)+"s";
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),5000);
  }
}
setInterval(lluviaBesos,700);

function mostrarMensaje(){
  document.getElementById("mensaje").innerHTML="Te amo mi gordita ❤️";
  document.getElementById("extraBoton").innerHTML=
  `<button onclick="document.getElementById('ventana').style.display='block'">
    Tengo otra sorpresa 💘
   </button>`;
}

function escapar(){
  btnNo.style.left=(Math.random()*200-100)+"px";
  btnNo.style.top=(Math.random()*200-100)+"px";
}

function mostrarBesito(){
  document.getElementById("ventana").style.display="none";
  document.getElementById("besito").style.display="block";
  document.getElementById("musica").src+="&autoplay=1";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para mi amor ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ffe6ec;
      font-family: Arial, sans-serif;
      overflow: hidden;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      color: #d6004c;
      margin: 0;
      z-index: 2;
    }

    h2 {
      font-size: 24px;
      color: #b3003b;
      margin-top: 10px;
      z-index: 2;
    }

    /* FOTO */
    img {
      width: 260px;
      height: auto;
      border-radius: 20px;
      margin-top: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.25);
      z-index: 2;
    }

    /* BOTÓN */
    button {
      margin-top: 20px;
      padding: 12px 25px;
      background: #ff4f85;
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      z-index: 2;
    }

    button:hover {
      background: #ff1f67;
      transform: scale(1.05);
    }

    /* Corazones animados */
    .heart {
      position: absolute;
      bottom: -50px;
      color: #ff2e72;
      font-size: 25px;
      animation: subir 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes subir {
      0% { transform: translateY(0) scale(1); opacity: 0.9; }
      100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
    }
  </style>
</head>

<body>

  <h1>Felices 5 meses mi amor ❤️</h1>
  <h2>De tu enamorado Matthew 💗</h2>

  <!-- FOTO -->
  <img src="https://github.com/Matthew1S-O/mi-pagina-de-amor/blob/main/imagen_2025-11-24_011044690.png?raw=true" alt="Nosotros ❤️">

  <!-- BOTÓN -->
  <button onclick="mostrarMensaje()">Tócame mi amor 💞</button>

  <!-- MENSAJE OCULTO -->
  <h2 id="mensaje" style="display:none; color:#d6004c; margin-top:20px;">
    Te amo mi gordita ❤️💞
  </h2>

  <!-- Corazones base -->
  <script>
    function crearCorazon() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (4 + Math.random() * 4) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(crearCorazon, 500);

    function mostrarMensaje() {
      document.getElementById("mensaje").style.display = "block";

      // Crear MUCHOS más corazones al presionar el botón
      for (let i = 0; i < 20; i++) {
        setTimeout(crearCorazon, i * 100);
      }
    }
  </script>

</body>
</html>

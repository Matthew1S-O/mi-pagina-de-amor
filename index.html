<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Para mi amor ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffb6c9, #ffe6ec);
      font-family: "Arial";
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 45px;
      color: #d6004c;
      animation: aparecer 2s ease-out;
    }

    p {
      font-size: 22px;
      margin-top: 10px;
      color: #7b0030;
      animation: aparecer 3s ease-out;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <h1>Felices 5 meses mi amor ❤️</h1>
  <p>Eres lo mejor que me ha pasado. Gracias por estar conmigo. 💕</p>
</body>
</html>

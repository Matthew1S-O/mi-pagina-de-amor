<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Para mi amor ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffe6ec;
      font-family: Arial;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      font-size: 40px;
      color: #d6004c;
      margin-top: 40px;
    }

    h2 {
      color: #c20042;
    }

    #foto {
      width: 300px;
      border-radius: 20px;
      margin-top: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    .corazon {
      position: fixed;
      font-size: 25px;
      animation: flotar 4s linear infinite;
      color: #ff2b6e;
    }

    @keyframes flotar {
      0% {transform: translateY(0) scale(1);}
      100% {transform: translateY(-120vh) scale(1.8); opacity: 0;}
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      background: #ff3d7a;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #ff174f;
      transform: scale(1.08);
    }

    /* Ventana emergente */
    #ventana {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 25px;
      width: 80%;
      max-width: 400px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
    }

    /* Botón que se mueve */
    #btnNo {
      position: relative;
    }
  </style>
</head>
<body>

  <h1>Felices 5 meses mi amor ❤️</h1>
  <h2>De tu enamorado Matthew 💖</h2>

  <img id="foto" src="https://github.com/Matthew1S-O/mi-pagina-de-amor/blob/main/imagen_2025-11-24_011044690.png?raw=true">

  <br><br>
  <button onclick="mostrarMensaje()">Presióname mi amor ❤️</button>

  <p id="mensaje" style="font-size:22px; color:#d6004c; font-weight:bold;"></p>

  <div id="extraBoton"></div>

  <!-- Ventana con la pregunta -->
  <div id="ventana">
    <h3 id="textoFecha"></h3>
    <p style="font-size:20px; font-weight:bold; color:#d6004c;">¿Amas a tu gordito? 💕</p>

    <button onclick="celebrar()">Sí ❤️</button>
    <button id="btnNo" onmouseover="escapar()">No 😒</button>
  </div>

  <script>
    // Corazones animados
    function lanzarCorazones() {
      for (let i = 0; i < 8; i++) {
        let cor = document.createElement("div");
        cor.className = "corazon";
        cor.innerHTML = "❤️";
        cor.style.left = Math.random() * 100 + "vw";
        cor.style.top = "100vh";
        document.body.appendChild(cor);

        setTimeout(() => cor.remove(), 4000);
      }
    }
    setInterval(lanzarCorazones, 800);

    // Botón 1
    function mostrarMensaje() {
      document.getElementById("mensaje").innerHTML = "Te amo mi gordita ❤️";
      lanzarCorazones();

      document.getElementById("extraBoton").innerHTML = `
        <button onclick="mostrarVentana()">Tengo otra sorpresa para ti 💘</button>
      `;
    }

    // Mostrar ventana con fecha/hora
    function mostrarVentana() {
      const fecha = new Date();
      const opciones = { year: 'numeric', month: 'long', day: 'numeric' };

      document.getElementById("textoFecha").innerHTML =
        "Hoy " + fecha.toLocaleDateString('es-ES', opciones) +
        " a las " + fecha.toLocaleTimeString('es-EC') +
        "<br><br>Amas a tu gordito? 😳❤️";

      document.getElementById("ventana").style.display = "block";
    }

    // Botón NO se escapa
    function escapar() {
      let btn = document.getElementById("btnNo");
      btn.style.left = (Math.random() * 200 - 100) + "px";
      btn.style.top = (Math.random() * 200 - 100) + "px";
    }

    // Celebración
    function celebrar() {
      for (let i = 0; i < 40; i++) {
        let p = document.createElement("div");
        p.innerHTML = "🎉";
        p.style.position = "fixed";
        p.style.left = Math.random() * 100 + "vw";
        p.style.top = Math.random() * 100 + "vh";
        p.style.fontSize = "30px";
        document.body.appendChild(p);

        setTimeout(() => p.remove(), 2000);
      }
      alert("Yoooo también te amooooo mi gordita hermosa ❤️💞");
    }
  </script>

</body>
</html>
